name: FB Content Pipeline

on:
  schedule:
    # Lunes, miércoles y viernes a las 14:00 UTC (08:00 El Salvador)
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema del artículo (opcional — usa default si vacío)'
        required: false
        default: ''
      angle_file:
        description: 'Archivo de ángulo editorial (opcional — usa default si vacío)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fb-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: content@agtisa.com
      RESEND_TO: info@agtisa.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article (MoA pipeline)
        run: |
          TOPIC="${{ github.event.inputs.topic || '' }}"
          ANGLE="${{ github.event.inputs.angle_file || '' }}"

          ARGS=""
          if [ -n "$TOPIC" ]; then
            ARGS="\"$TOPIC\""
          fi
          if [ -n "$ANGLE" ]; then
            ARGS="$ARGS @$ANGLE"
          fi

          echo "Running groq-news.mjs with args: $ARGS"
          node scripts/groq-news.mjs $ARGS

      - name: Send article + prompt via email
        if: success()
        run: node scripts/notify-email.mjs

      - name: Generate image (Imagen 4 Fast)
        if: success()
        run: node scripts/generate-image.mjs

      - name: Apply branding to image
        if: success()
        run: node scripts/add-branding.mjs scripts/generated-image.png --output scripts/generated-image-branded.png

      - name: Save outputs as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fb-content-${{ github.run_id }}
          path: |
            scripts/generated-article.txt
            scripts/gemini-prompt.txt
            scripts/gemini-video-prompt.txt
            scripts/gemini-video-prompt-*.txt
            scripts/gemini-video-script.json
            scripts/generated-image.png
            scripts/generated-image-branded.png
          retention-days: 30
